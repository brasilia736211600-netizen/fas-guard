name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$(find "$SDK" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | head -1)"
          if [ -z "$SM" ]; then
            echo "::error::sdkmanager not found under $SDK"; exit 1
          fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare signing key
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > keystore.jks
            echo "KEYSTORE=keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
            echo "KEY_PASS=$KEYPASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore keystore.jks -alias fasguard \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass fasguard -keypass fasguard \
              -dname "CN=FAS Guard, O=FAS, C=US" >/dev/null 2>&1
            echo "::warning::No signing secrets configured – using an ephemeral key. Add ANDROID_KEYSTORE_B64/PASS/KEY_PASS for stable updates."
            echo "KEYSTORE=keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FASGuard-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FAS Guard · latest build
          body: |
            Automated build of `${{ github.sha }}`.

            Download the APK below, allow "install unknown apps" and install.
          files: dist/*.apk
          make_latest: true
          prerelease: false
